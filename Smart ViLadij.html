@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--card:#18212a;--ink:#f1f4f7;--mut:#9aa6b1;--line:#26323d}}
:root[data-theme="dark"]{--bg:#0e1419;--card:#18212a;--ink:#f1f4f7;--mut:#9aa6b1;--line:#26323d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100%}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.hero{background:#fff;border-radius:24px;padding:22px 18px;display:flex;justify-content:center;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(79,155,200,.18);perspective:900px}
.hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,rgba(79,155,200,.22),transparent 55%);animation:glow 4s ease-in-out infinite}
.logo{position:relative;width:min(320px,80%);aspect-ratio:1145/643;background:var(--logo) center/contain no-repeat;transform-style:preserve-3d;animation:pop3d 1.1s cubic-bezier(.2,1.4,.4,1) both,tilt3d 4.5s ease-in-out 1.1s infinite}
.logo::after{content:"";position:absolute;inset:0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) -150% 0/250% 100% no-repeat;animation:shine 3.2s ease-in-out 1.3s infinite}
@keyframes pop3d{0%{opacity:0;transform:scale(.5) rotateY(-50deg) rotateX(12deg) translateZ(-60px)}60%{opacity:1;transform:scale(1.06) rotateY(8deg) rotateX(-3deg) translateZ(10px)}100%{opacity:1;transform:none}}
@keyframes tilt3d{0%,100%{transform:rotateY(0deg) rotateX(0deg) translateZ(0) translateY(0);filter:drop-shadow(0 10px 14px rgba(20,40,60,.18))}25%{transform:rotateY(-16deg) rotateX(6deg) translateZ(24px) translateY(-6px);filter:drop-shadow(14px 20px 18px rgba(20,40,60,.24))}50%{transform:rotateY(0deg) rotateX(-6deg) translateZ(34px) translateY(-10px);filter:drop-shadow(0 26px 20px rgba(20,40,60,.26))}75%{transform:rotateY(16deg) rotateX(6deg) translateZ(24px) translateY(-6px);filter:drop-shadow(-14px 20px 18px rgba(20,40,60,.24))}}
@keyframes glow{50%{transform:scale(1.15);opacity:.6}}
@keyframes shine{0%{background-position:-150% 0}60%,100%{background-position:150% 0}}
h2{font-size:1.05rem;margin:26px 4px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.card.main{grid-column:1/-1;border:2px solid var(--blue)}
.qr{display:block;width:100%;max-width:230px;border-radius:14px;background:#fff}
.card b{font-size:1.02rem}
.sub{color:var(--mut);font-size:.82rem;direction:ltr;word-break:break-all}
.hint{color:var(--mut);font-size:.8rem}
.btn{display:block;width:100%;padding:11px;border-radius:14px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;margin-top:auto}
.btn.o{background:var(--org)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script>

function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function qrURL(text,img){
  const qr=qrcode(0,'H');qr.addData(text);qr.make();
  const n=qr.getModuleCount(),q=4,S=720,m=S/(n+2*q),c=document.createElement('canvas');
  c.width=c.height=S;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,S,S);x.fillStyle='#111';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect(Math.round((q+k)*m),Math.round((q+r)*m),Math.ceil(m),Math.ceil(m));
  const w=S*.34,h=w*643/1145,p=S*.022,X=(S-w)/2,Y=(S-h)/2;
  x.fillStyle='#fff';rr(x,X-p,Y-p,w+2*p,h+2*p,S*.03);x.fill();
  x.drawImage(img,X,Y,w,h);
  return c.toDataURL('image/png');
}

};

</script>
